name: CI

on:
  push:
    branches: [lukel/sandbox]
  pull_request:
    branches: [lukel/sandbox]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
