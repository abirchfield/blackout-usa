name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Package build files
        run: |
          cd build
          zip -r "../blackoutusa-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "blackoutusa-${GITHUB_REF_NAME}.zip" \
            --title "Blackout USA ${GITHUB_REF_NAME}" \
            --notes "Static Blackout USA build files for ${GITHUB_REF_NAME}."
