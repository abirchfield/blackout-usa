<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="6" y1="22" x2="26" y2="22" stroke="#334155" stroke-width="0.6"/>
  <line x1="6" y1="26" x2="26" y2="26" stroke="#293548" stroke-width="0.4"/>
  <!-- Tower body -->
  <path d="M14.5 8 L16 5 L17.5 8" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="16" y1="8" x2="16" y2="22" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="13" y1="22" x2="19" y2="22" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Tower cross arms -->
  <line x1="11" y1="11" x2="21" y2="11" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="15" x2="20" y2="15" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Power lines drooping from arms -->
  <path d="M6 10.5 Q8.5 12.5 11 11" fill="none" stroke="url(#bolt)" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M21 11 Q23.5 12.5 26 10.5" fill="none" stroke="url(#bolt)" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M6 14.5 Q9 16 12 15" fill="none" stroke="url(#bolt)" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M20 15 Q23 16 26 14.5" fill="none" stroke="url(#bolt)" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Tower legs -->
  <line x1="16" y1="22" x2="13" y2="26" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="19" y2="26" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <!-- Small glow on tower top -->
  <circle cx="16" cy="5" r="1.2" fill="#fbbf24" opacity="0.7"/>
</svg>
